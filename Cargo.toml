[workspace]
members = ["crates/clip-convert-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
too_many_lines = "warn"
unwrap_used = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
anyhow = "1.0"
log = "0.4"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "0.8"
url = "2.5"

[package]
name = "clip-convert"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Clipboard action launcher: auto-shorten URLs and run configurable actions on clipboard content."

[lints]
workspace = true

[dependencies]
clip-convert-core = { path = "crates/clip-convert-core" }
anyhow.workspace = true
log.workspace = true
env_logger = "0.11"
egui = "0.29"
notify-rust = "4"
async-channel = "2"
fs2 = "0.4"
signal-hook = "0.3"
# glow (OpenGL) rather than wgpu: lighter, faster to start, and this app draws
# four dialogs, not a 3D scene.
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts", "glow", "wayland", "x11",
] }

# The tray is split by platform on purpose. tray-icon's Linux backend is built
# on GTK and libappindicator, which would pull a C toolkit back in; ksni speaks
# the StatusNotifierItem D-Bus protocol that Linux desktops implement natively.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3"
tokio = { version = "1", features = ["rt"] }
evdev = "0.12"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.19"
global-hotkey = "0.6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
