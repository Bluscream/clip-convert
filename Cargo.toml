[workspace]
members = ["crates/clip-convert-core", "crates/clip-convert-dialog"]

[workspace.package]
version = "0.4.3"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
too_many_lines = "warn"
unwrap_used = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
anyhow = "1.0"
log = "0.4"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "0.8"
url = "2.5"

[package]
name = "clip-convert"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Clipboard action launcher: auto-shorten URLs and run configurable actions on clipboard content."

[lints]
workspace = true

[dependencies]
clip-convert-core = { path = "crates/clip-convert-core" }
anyhow.workspace = true
log.workspace = true
env_logger = "0.11"
notify-rust = "4"
fs2 = "0.4"
signal-hook = "0.3"
serde_json = "1.0"
tempfile = "3"

# The tray is split by platform on purpose. tray-icon's Linux backend is built
# on GTK and libappindicator, which would pull a C toolkit back in; ksni speaks
# the StatusNotifierItem D-Bus protocol that Linux desktops implement natively.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3"
tokio = { version = "1", features = ["rt"] }
evdev = "0.12"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.25"
global-hotkey = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# No `panic = "abort"`: one dependency cannot be compiled with it. The
# behaviour is kept by a panic hook in main.rs, which aborts the process.
