<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- A clipboard, with one format becoming another on it. -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="#2f3542"/>
  <g fill="none" stroke="#ffffff" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
    <!-- The board -->
    <path d="M72 56h112a16 16 0 0 1 16 16v128a16 16 0 0 1-16 16H72a16 16 0 0 1-16-16V72a16 16 0 0 1 16-16z"/>
    <!-- The clip -->
    <path d="M100 56V44a12 12 0 0 1 12-12h32a12 12 0 0 1 12 12v12z"/>
  </g>
  <!-- One shape becoming another: a filled square, an arrow, an outline -->
  <rect x="78" y="124" width="32" height="32" rx="6" fill="#ffffff"/>
  <path d="M118 140h12" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
  <path d="M128 131l13 9-13 9z" fill="#ffffff"/>
  <rect x="148" y="124" width="32" height="32" rx="6" fill="none" stroke="#ffffff" stroke-width="8"/>
</svg>
